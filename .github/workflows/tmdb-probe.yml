name: One-time TMDB check (missing titles)

# Temporary: started by hand once to see which missing movies are streaming on a service
# Tivvy tracks (US). Prints facts, never the key. Remove after use.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Look up titles on TMDB
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TITLES: '["Mad Max: Fury Road", "The Martian", "Spotlight", "Jurassic World", "La La Land", "Get Out", "Crazy Rich Asians", "A Star Is Born", "Bohemian Rhapsody", "Knives Out", "Jojo Rabbit", "Ford v Ferrari", "Nomadland", "The Trial of the Chicago 7", "Encanto", "The Power of the Dog", "Free Guy", "Everything Everywhere All at Once", "Turning Red", "Elvis", "Black Panther: Wakanda Forever", "Nope", "The Fabelmans", "Past Lives", "Anatomy of a Fall", "Air", "Asteroid City", "Elemental", "Nimona"]'
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.parse
          key = os.environ["TMDB_API_KEY"].strip(); bearer = len(key) > 40
          def get(path, **q):
              if not bearer: q["api_key"] = key
              req = urllib.request.Request(f"https://api.themoviedb.org/3{path}?{urllib.parse.urlencode(q)}", headers={"Authorization": f"Bearer {key}"} if bearer else {})
              return json.loads(urllib.request.urlopen(req, timeout=60).read())
          for name in json.loads(os.environ["TITLES"]):
              res = get("/search/movie", query=name).get("results", [])
              if not res: print(f"{name} | not found on TMDB"); continue
              m = max(res[:5], key=lambda r: r.get("vote_count") or 0)
              us = get(f"/movie/{m['id']}/watch/providers").get("results", {}).get("US", {})
              print(f"{name} | {m.get('release_date','')[:4]} | votes {m.get('vote_count')} | streaming: {', '.join(p['provider_name'] for p in us.get('flatrate', [])) or 'none'}")
          PY
