name: One-time TMDB check (missing titles)

# Temporary: started by hand once to see why a title isn't in Tivvy (its US streaming
# services, and where it ranks in the lists Tivvy reads). Prints facts, never the key.
# Remove after use.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Look up titles on TMDB
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.parse, datetime as dt
          key = os.environ["TMDB_API_KEY"].strip()
          bearer = len(key) > 40
          def get(path, **q):
              if not bearer: q["api_key"] = key
              req = urllib.request.Request(f"https://api.themoviedb.org/3{path}?{urllib.parse.urlencode(q)}",
                                           headers={"Authorization": f"Bearer {key}"} if bearer else {})
              return json.loads(urllib.request.urlopen(req, timeout=60).read())
          for name in ["Happy Gilmore 2", "Conclave"]:
              res = get("/search/movie", query=name).get("results", [])[:3]
              print(f"===== {name}: search results", [(r["id"], r["title"], r.get("release_date"), r.get("vote_count")) for r in res])
              if not res: continue
              m = res[0]
              prov = get(f"/movie/{m['id']}/watch/providers").get("results", {}).get("US", {})
              print("  US flatrate:", [p["provider_name"] for p in prov.get("flatrate", [])])
              print("  US rent/buy:", [p["provider_name"] for p in prov.get("rent", []) + prov.get("buy", [])][:6])
              # where it ranks among Netflix's (provider 8) most-rated movies of the last 3 years
              since = (dt.date.today() - dt.timedelta(days=365 * 3)).isoformat()
              for page in range(1, 6):
                  d = get("/discover/movie", watch_region="US", with_watch_providers="8|1796", with_watch_monetization_types="flatrate",
                          sort_by="vote_count.desc", **{"primary_release_date.gte": since}, page=page)
                  ids = [r["id"] for r in d.get("results", [])]
                  if m["id"] in ids:
                      print(f"  Netflix recent most-rated: page {page}, position {ids.index(m['id']) + 1}"); break
              else:
                  print("  Netflix recent most-rated: not in the first 100")
          PY
