name: One-time MDBList check (TV show ratings)

# Temporary: started by hand once to see what MDBList returns for a TV show
# (does it have season-by-season Rotten Tomatoes scores?). Prints the shape of
# the answer, never the key. Remove after use.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Look up two shows on MDBList
        env:
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.parse
          key = os.environ["MDBLIST_API_KEY"].strip()
          def show(v, depth=0):
              # print the structure, with short values, hiding anything that looks like the key
              pad = "  " * depth
              if isinstance(v, dict):
                  for k, x in v.items():
                      if isinstance(x, (dict, list)):
                          print(f"{pad}{k}:"); show(x, depth + 1)
                      else:
                          print(f"{pad}{k}: {str(x)[:80]!r}")
              elif isinstance(v, list):
                  print(f"{pad}[list of {len(v)}]")
                  for x in v[:8]:
                      show(x, depth + 1); print(f"{pad}  --")
              else:
                  print(f"{pad}{str(v)[:80]!r}")
          for name, imdb in (("Ted Lasso", "tt10986410"), ("Peaky Blinders", "tt2442560")):
              for path in (f"imdb/show/{imdb}", f"imdb/show/{imdb}?append_to_response=seasons"):
                  url = f"https://api.mdblist.com/{path}{'&' if '?' in path else '?'}{urllib.parse.urlencode({'apikey': key})}"
                  print(f"===== {name}: {path} =====")
                  try:
                      d = json.loads(urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "tivvy/1.0"}), timeout=60).read())
                      d.pop("description", None)
                      show(d)
                  except Exception as e:
                      print("error:", str(e).replace(key, "***"))
          PY
